name: One-time verified source import
on:
  push:
    paths:
      - '.github/workflows/bootstrap.yml'
permissions:
  contents: write
jobs:
  import:
    if: github.ref == 'refs/heads/main' && github.repository == 'felipewatter/ci-trustgraph'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout staging commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate and publish checked source
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .bootstrap/source.tar.xz.b64 > /tmp/ci-trustgraph-source.tar.xz
          echo 'b294fc1aeb86bc6d5596314239ebb9f79763190ca89bf3c36bf7a5322f38ffaf  /tmp/ci-trustgraph-source.tar.xz' | sha256sum --check
          tar -tJf /tmp/ci-trustgraph-source.tar.xz >/dev/null
          tar -xJf /tmp/ci-trustgraph-source.tar.xz
          # The finalized release and CI workflows are installed separately via the GitHub integration.
          rm -f .github/workflows/ci.yml .github/workflows/release.yml
          rm -rf .bootstrap
          python3 -m pip install -e .
          python3 -m compileall -q src tests
          python3 -m unittest discover -s tests -v
          ci-trustgraph . --fail-on high --format json --output /tmp/ci-trustgraph-bootstrap-report.json
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat: publish CI TrustGraph v1.0.0 source, tests and docs'
          git push origin HEAD:main
