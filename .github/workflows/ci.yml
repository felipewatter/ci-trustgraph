name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e .
      - name: Compile
        run: python -m compileall -q src tests
      - name: Run regression suite
        run: python -m unittest discover -s tests -v
      - name: Analyze repository workflows
        run: ci-trustgraph . --fail-on high --format json --output ci-trustgraph-report.json
      - name: Export SARIF and parse
        run: |
          ci-trustgraph . --fail-on high --format sarif --output trustgraph.sarif
          python -c "import json; p=json.load(open('trustgraph.sarif')); assert p['version']=='2.1.0'"
